<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#150710">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mission">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="config.js"></script>
<title>Mission du jour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* Plan : une colonne étroite (560 px), résumé du jour en tête, cartes de tâches, barre d'onglets en bas.
   Un seul univers visuel : velours bordeaux de nuit, rose poudré pour l'action, or pour le score. */
:root {
  --bg: #150710;
  --surface: #221018;
  --raised: #31182a;
  --line: #4a2a3c;
  --ink: #f7ecef;
  --mute: #c2a5b1;
  --rose: #eaa8bb;
  --gold: #dcb76d;
  --ok: #93caa4;
  --late: #eaa75f;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Figtree", -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background: radial-gradient(120% 50% at 50% -8%, #3b1631 0%, rgba(21, 7, 16, 0) 62%), var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
}
[hidden] { display: none !important; }
h1, h2, h3, h4, p { margin: 0; }
button { font-family: inherit; touch-action: manipulation; }
button:focus, a:focus, summary:focus, input:focus, select:focus, textarea:focus { outline: 2px solid var(--rose); outline-offset: 2px; }
button:focus:not(:focus-visible), summary:focus:not(:focus-visible) { outline: none; }

.shell { max-width: 560px; margin: 0 auto; padding: 14px 16px calc(96px + env(safe-area-inset-bottom)); padding-top: calc(14px + env(safe-area-inset-top)); }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.brand { font-family: var(--display); font-style: italic; font-weight: 500; font-size: 20px; letter-spacing: 0.01em; color: var(--rose); }
.sync { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--mute); white-space: nowrap; }
.sync.ok { color: var(--ok); border-color: rgba(147, 202, 164, 0.4); }
.sync.warn { color: var(--late); border-color: rgba(234, 167, 95, 0.5); }

.view { display: grid; gap: 18px; }

.hero { padding: 20px 18px 18px; border: 1px solid var(--line); border-radius: 20px; background: linear-gradient(160deg, var(--raised), var(--surface)); display: grid; gap: 14px; }
.hello { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1.05; text-wrap: balance; }
.hello em { font-weight: 500; color: var(--rose); }
.date { color: var(--mute); font-size: 15px; margin-top: 4px; }
.bar { height: 8px; border-radius: 99px; background: var(--bg); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--rose), var(--gold)); transition: width 0.4s ease; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { padding: 10px 10px 8px; border-radius: 14px; background: rgba(21, 7, 16, 0.55); border: 1px solid var(--line); }
.stat b { display: block; font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.05; color: var(--gold); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--mute); }
.love { padding: 14px 18px; border-radius: 16px; border: 1px solid var(--line); border-left: 3px solid var(--rose); background: rgba(49, 24, 42, 0.45); }
.love-text { font-family: var(--display); font-style: italic; font-weight: 500; font-size: 19px; line-height: 1.35; color: var(--ink); text-wrap: balance; }
.love-sig { margin-top: 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--rose); }
.hero-note { color: var(--ok); font-weight: 600; }

.banner { padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(234, 167, 95, 0.5); color: var(--late); font-size: 14px; }

.sec { display: grid; gap: 10px; }
.sec h2 { font-family: var(--display); font-weight: 700; font-size: 22px; display: flex; align-items: baseline; gap: 8px; text-wrap: balance; }
.sec h2 small { font-family: var(--body); font-size: 13px; font-weight: 600; color: var(--mute); }
.sec .sub { color: var(--mute); font-size: 14px; margin-top: -4px; }

.task { display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.task.late { border-left: 4px solid var(--late); }
.task.done { opacity: 0.66; }
.task.done .t-title { text-decoration: line-through; text-decoration-color: var(--rose); }
.check { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--rose); background: transparent; color: var(--bg); display: grid; place-items: center; padding: 0; cursor: pointer; }
.check svg { width: 22px; height: 22px; opacity: 0; transition: opacity 0.15s; }
.check[aria-checked="true"] { background: var(--rose); }
.check[aria-checked="true"] svg { opacity: 1; }
.check[disabled] { opacity: 0.45; cursor: default; }
.t-body { min-width: 0; }
.t-meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
.pill { padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); }
.pill.late { color: var(--late); border-color: rgba(234, 167, 95, 0.6); }
.pill.tt { color: var(--ok); border-color: rgba(147, 202, 164, 0.4); }
.pill.ig { color: var(--rose); border-color: rgba(234, 168, 187, 0.5); }
.pill.occ { color: var(--gold); border-color: rgba(220, 183, 109, 0.55); }
.pill.warn { color: var(--late); border-color: rgba(234, 167, 95, 0.6); text-transform: none; letter-spacing: 0; font-weight: 600; }
.t-title { font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.2; margin: 6px 0 2px; text-wrap: balance; overflow-wrap: anywhere; }
.t-hook { color: var(--mute); font-size: 15px; overflow-wrap: anywhere; }
.more { background: none; border: 0; padding: 0; margin-top: 4px; min-height: 40px; color: var(--rose); font-size: 15px; font-weight: 600; cursor: pointer; }
.detail { display: grid; gap: 14px; margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 15px; }
.detail h4 { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); margin-bottom: 4px; }
.detail ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.detail p { overflow-wrap: anywhere; }
.copybox { padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); -webkit-user-select: all; user-select: all; overflow-wrap: anywhere; }
.copyrow { display: grid; gap: 6px; justify-items: start; }

.btn { min-height: 46px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--rose); background: transparent; color: var(--rose); font-size: 15px; font-weight: 700; cursor: pointer; }
.btn.primary { background: var(--rose); color: #2a0f1c; }
.btn.small { min-height: 40px; padding: 0 14px; font-size: 14px; }
.btn.danger { border-color: rgba(234, 167, 95, 0.6); color: var(--late); }
.btn[disabled] { opacity: 0.5; }

details.fold { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
details.fold > summary { list-style: none; cursor: pointer; padding: 14px; min-height: 48px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "+"; color: var(--rose); font-size: 22px; line-height: 1; }
details.fold[open] > summary::after { content: "\2212"; }
details.fold > .fold-body { padding: 0 14px 14px; display: grid; gap: 10px; font-size: 15px; }
.rule { display: grid; gap: 2px; }
.rule b { color: var(--ink); }
.rule span { color: var(--mute); }

form.card { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--mute); }
input, select, textarea { width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; -webkit-appearance: none; appearance: none; }
textarea { min-height: 92px; resize: vertical; }
select { background-image: linear-gradient(45deg, transparent 50%, var(--rose) 50%), linear-gradient(135deg, var(--rose) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

.req { display: grid; grid-template-columns: 1fr; gap: 8px; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.req .t-title { margin: 2px 0 0; font-size: 19px; }
.req .actions { margin-top: 2px; }
.empty { color: var(--mute); font-size: 15px; padding: 4px 2px; }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 150px; padding: 14px 12px 8px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.wcol { display: grid; grid-template-rows: 1fr auto auto; gap: 4px; height: 100%; text-align: center; font-size: 11px; color: var(--mute); }
.wbar { align-self: end; width: 100%; min-height: 3px; border-radius: 6px 6px 2px 2px; background: var(--line); }
.wbar.has { background: linear-gradient(180deg, var(--rose), var(--gold)); }
.wcol.today { color: var(--ink); font-weight: 700; }
.sources { display: grid; gap: 8px; font-size: 14px; }
.sources a { color: var(--rose); overflow-wrap: anywhere; }
.small { font-size: 13px; color: var(--mute); }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 6px; padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); background: rgba(21, 7, 16, 0.94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
.tab { flex: 1; max-width: 190px; min-height: 50px; border: 0; border-radius: 12px; background: transparent; color: var(--mute); font-size: 14px; font-weight: 700; cursor: pointer; border-top: 2px solid transparent; }
.tab[aria-selected="true"] { color: var(--rose); border-top-color: var(--rose); background: rgba(234, 168, 187, 0.08); }

.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 600; text-align: center; z-index: 5; }

@media (max-width: 380px) {
  .hello { font-size: 30px; }
  .stat b { font-size: 26px; }
  .row2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .bar > i, .check svg { transition: none; }
}

.heart-fly { position: fixed; z-index: 60; pointer-events: none; font-size: 20px; line-height: 1; opacity: 0; animation: heartUp 1.2s ease-out forwards; }
@keyframes heartUp {
  0% { opacity: 0; transform: translateY(0) scale(0.5); }
  15% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-90px) scale(1.25); }
}
@media (prefers-reduced-motion: reduce) { .heart-fly { display: none; } }

body.gated .shell, body.gated .tabs { visibility: hidden; }
.gate { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); }
.gate[hidden] { display: none; }
.gate-card { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; text-align: center; }
.gate-brand { margin: 0; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.gate-title { margin: 0 0 10px; font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1.1; color: var(--ink); }
.gate-label { text-align: left; font-size: 13px; color: var(--mute); font-weight: 600; }
#gate-pin { text-align: center; font-size: 24px; letter-spacing: 0.4em; -webkit-text-security: disc; text-security: disc; }
.gate-msg { margin: 0; min-height: 20px; font-size: 14px; color: var(--late); font-weight: 600; }

.hero-done { display: flex; align-items: center; gap: 12px; }
.hero-done .hero-note { margin: 0; }
.hero-panda { flex: 0 0 auto; width: 76px; height: 76px; border-radius: 28%; overflow: hidden; background: linear-gradient(160deg, #ffe6ec, #f7bccd); }
.hero-panda svg { display: block; width: 100%; height: 100%; }
.panda-pop { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(15, 7, 12, 0.8); animation: pandaFade 0.25s ease-out; }
.panda-card { position: relative; overflow: hidden; width: 100%; max-width: 330px; padding: 22px 22px 24px; border-radius: 26px; border: 1px solid #4a2a3c; background: #1f1119; text-align: center; animation: pandaPop 0.55s cubic-bezier(0.2, 1.4, 0.4, 1); }
.panda-art { width: 190px; height: 190px; margin: 0 auto 10px; border-radius: 28%; overflow: hidden; background: linear-gradient(160deg, #ffe6ec, #f7bccd); box-shadow: 0 6px 22px rgba(0, 0, 0, 0.35); animation: pandaBob 2.6s ease-in-out infinite; }
.panda-art svg { display: block; width: 100%; height: 100%; }
.panda-title { margin: 0 0 6px; font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.15; color: var(--ink); }
.panda-msg { margin: 0 0 6px; font-size: 16px; line-height: 1.45; color: var(--ink); }
.panda-card .love-sig { margin: 0 0 16px; }
.pop-heart { position: absolute; bottom: 8px; font-size: 18px; line-height: 1; opacity: 0; pointer-events: none; animation: popFloat 3.4s ease-in infinite; }
@keyframes pandaFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pandaPop { 0% { opacity: 0; transform: scale(0.6) translateY(30px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
@keyframes pandaBob { 0%, 100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-7px) rotate(1.5deg); } }
@keyframes popFloat { 0% { opacity: 0; transform: translateY(0) scale(0.7); } 15% { opacity: 0.95; } 100% { opacity: 0; transform: translateY(-300px) scale(1.2); } }
@media (prefers-reduced-motion: reduce) { .panda-pop, .panda-card, .panda-art, .pop-heart { animation: none; } .pop-heart { display: none; } }

/* ---- Idée pour demain + onglet Idées ---- */
:root { --stop: #f29a9a; }
.note-card { display: grid; gap: 10px; padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
.note-card h2 { font-family: var(--display); font-weight: 700; font-size: 22px; text-wrap: balance; }
.note-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--mute); }
.note-state { font-weight: 700; color: var(--late); }
.note-state.ok { color: var(--ok); }
.note-verdict { display: grid; gap: 8px; padding: 12px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); }
.note-verdict p { font-size: 14px; color: var(--mute); }
.vchip { display: inline-block; width: fit-content; padding: 4px 12px; border-radius: 99px; font-size: 13px; font-weight: 700; border: 1px solid var(--line); }
.vchip.good { color: var(--ok); border-color: rgba(147, 202, 164, 0.5); }
.vchip.tweak { color: var(--gold); border-color: rgba(220, 183, 109, 0.55); }
.vchip.no { color: var(--stop); border-color: rgba(242, 154, 154, 0.55); }
.idea-card { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
.idea-when { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
.idea-summary { font-size: 15px; overflow-wrap: anywhere; }
.ba { display: grid; grid-template-columns: 1fr; gap: 10px; }
.ba-col { display: grid; gap: 8px; align-content: start; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); }
.ba-col.after { border-color: rgba(147, 202, 164, 0.45); }
.ba-col h4 { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
.ba-col.after h4 { color: var(--ok); }
.ba-text { font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.ba-line { display: grid; gap: 1px; font-size: 15px; overflow-wrap: anywhere; }
.ba-line b { font-size: 12px; color: var(--gold); }
.chg { display: grid; gap: 8px; list-style: none; padding: 0; margin: 0; font-size: 14px; }
.chg li { display: grid; gap: 1px; padding-left: 12px; border-left: 2px solid var(--line); overflow-wrap: anywhere; }
.chg li span { color: var(--mute); font-size: 13px; }
.pickrow { display: flex; flex-wrap: wrap; gap: 8px; }
.btn[aria-pressed="true"] { background: var(--rose); color: #2a0f1c; }
.flag { display: grid; gap: 1px; }
.flag b { color: var(--late); }
.flag.stop b { color: var(--stop); }
.flag span { color: var(--mute); }
.feedback { padding: 12px 14px; border-radius: 14px; border-left: 3px solid var(--rose); background: rgba(49, 24, 42, 0.45); }
.feedback .love-sig { margin-top: 4px; }
@media (min-width: 560px) { .ba { grid-template-columns: 1fr 1fr; } }
@media (max-width: 380px) { .tab { font-size: 12px; } }

/* ---- Guide détaillé, remplacement d'une idée ---- */
.pill.swap { color: var(--gold); border-color: rgba(220, 183, 109, 0.55); }
.swapnote { display: grid; gap: 6px; margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: rgba(220, 183, 109, 0.08); border: 1px solid rgba(220, 183, 109, 0.35); font-size: 14px; }
.swapnote .more { justify-self: start; margin-top: 0; }
.cant { display: block; margin-top: 4px; padding: 0; min-height: 40px; background: none; border: 0; color: var(--mute); font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.stack { display: grid; gap: 8px; }
.quote { font-family: var(--display); font-style: italic; font-size: 17px; line-height: 1.3; color: var(--ink); overflow-wrap: anywhere; }
ul.plain { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.detail ul.plain { font-size: 15px; }
.mini { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 45; display: flex; align-items: flex-end; justify-content: center; background: rgba(15, 7, 12, 0.8); animation: pandaFade 0.2s ease-out; }
.sheet-card { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; -webkit-overflow-scrolling: touch; display: grid; gap: 12px; align-content: start; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; background: var(--surface); }
.sheet-card .t-title { margin: 0; }
.sheet-card .gate-msg { min-height: 0; text-align: left; }
@media (min-width: 600px) { .sheet { align-items: center; } .sheet-card { border-bottom: 1px solid var(--line); border-radius: 22px; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }

.tiny { font-size: 12px; line-height: 1.4; color: var(--mute); margin: 10px 0 0; }

.tab.hot { color: #ff8a8a; }
.tab.hot[aria-selected="true"] { color: #ff8a8a; border-top-color: #ff8a8a; background: rgba(255, 138, 138, 0.1); }
.chk { display: flex; align-items: center; gap: 10px; font-weight: 700; color: #ff8a8a; }
.chk input { width: 22px; height: 22px; flex: none; }
.urgent-banner { display: block; width: 100%; text-align: left; border: 1px solid #ff8a8a; background: rgba(255, 138, 138, 0.12); color: #ffb3b3; border-radius: 14px; padding: 14px 16px; font-size: 15px; font-weight: 700; cursor: pointer; }
.pill.urgent { background: rgba(255, 138, 138, 0.18); color: #ff8a8a; border-color: #ff8a8a; }

</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <span class="brand">Pieds de Velours</span>
    <span id="sync" class="sync" role="status" aria-live="polite">Connexion…</span>
  </header>

  <main>
    <section id="view-aujourdhui" class="view" aria-labelledby="tab-aujourdhui">
      <div id="today-body" class="view"></div>
      <div id="push-slot" class="view"></div>
      <div id="note-slot" class="view"></div>
      <div id="today-foot" class="view"></div>
    </section>

    <section id="view-urgent" class="view" hidden aria-labelledby="tab-urgent">
      <div id="urgent-body" class="view"></div>
    </section>

    <section id="view-demandes" class="view" hidden aria-labelledby="tab-demandes">
      <form id="req-form" class="card" novalidate>

var PANDA_INK = "#2a1715", PANDA_RUST = "#d9622b", PANDA_DARK = "#7a2c15", PANDA_CREAM = "#fff3e4";

function pandaHeart(cx, cy, s, fill) {

function pandaFlower(cx, cy, color) {

function pandaSpark(cx, cy, r, fill) {

function pandaZ(x, y, s, color) {

   to = titre de l'idée de remplacement ("" quand aucune ne convient : Timothée répond) ; from = titre de l'idée remplacée. */

}

}

function tasksForDate(date, swaps) {

    out.push({ key: date + "|" + slots[i], date: date, slot: slots[i], kind: "post", label: "Post " + (i + 1), idea: idea, swap: sw });
  }

/* ---- Choisir l'idée qui remplace : on écarte ce qui demande un objet manquant, ce qui est déjà au programme
   de la semaine, et la famille de l'autre post du jour ; puis on préfère ce qui répond à la raison donnée. ---- */

  var orig = tasksForDate(date, null), cur = tasksForDate(date, swaps), slotIdx = SWAP_SLOTS.indexOf(slot);
  if (slotIdx < 0 || !orig.length) { return ""; }
  var origTask = orig[slotIdx], curTask = cur[slotIdx], prev = swapOf(swaps, date, slot);
  var avoid = {}, other = null, pool = [];
  function titleOf(task) { return task.kind === "story" ? task.story.t : task.idea.t; }
  avoid[titleOf(origTask)] = 1; avoid[titleOf(curTask)] = 1;
  if (opt.from) { avoid[opt.from] = 1; }
  if (prev) { if (prev.from) { avoid[prev.from] = 1; } if (prev.to) { avoid[prev.to] = 1; } }
  for (k = -1; k <= 7; k++) {
    var day = tasksForDate(addDays(date, k), swaps);
    for (j = 0; j < day.length; j++) {
      if (k === 0 && j === slotIdx) { continue; }
      avoid[titleOf(day[j])] = 1;
      if (k === 0 && j !== slotIdx && slot !== "story" && day[j].kind === "post") { other = day[j].idea; }
    }
  }
  if (slot === "story") { pool = STORY_POOL; }
  else if (origTask.idea.p === "ig") { pool = PLAN_IG; }
  else { pool = PLAN_TT; }
  var allItems = items.slice();
  if (prev && prev.items) { for (i = 0; i < prev.items.length; i++) { if (allItems.indexOf(prev.items[i]) < 0) { allItems.push(prev.items[i]); } } }
  var start = swapHash(date + "|" + slot) % pool.length, best = null, bestScore = -1e9, n, c, needs, score, x, ox;
  for (n = 0; n < pool.length; n++) {
    c = pool[(start + n) % pool.length];
    if (avoid[c.t]) { continue; }
    needs = slot === "story" ? storyNeeds(c) : ideaNeeds(c);
    var clash = false;
    for (i = 0; i < needs.length; i++) { if (allItems.indexOf(needs[i]) >= 0) { clash = true; break; } }
    if (clash) { continue; }
    score = 0;
    if (slot === "story") {
      if (c.type === origTask.story.type) { score += 3; }
      if (why.indexOf("time") >= 0 && needs.length === 0) { score += 1; }
    } else {
      x = ideaX(c);
      if (other && c.f === other.f) { score -= 3; }
      if (c.f === origTask.idea.f) { score -= 1; }
      if (other && other.f === "Clin d'œil" && c.f === "Clin d'œil") { score -= 4; }
      if (x && x.p) { score += 1; }
      if (why.indexOf("time") >= 0) { score += (needs.length === 0 ? 2 : -needs.length) + (c.s.length <= 3 ? 1 : 0); }
      if (why.indexOf("shy") >= 0) { score += (c.f !== "Clin d'œil" && !c.r ? 3 : 0); }
      if (why.indexOf("unclear") >= 0 && x && x.p) { score += 3; }
      if (why.indexOf("item") >= 0 && needs.length === 0) { score += 1; }
    }
    if (score > bestScore) { best = c; bestScore = score; }
  }
  return best ? best.t : "";
}

/* ---- État : { auto: { "AAAA-MM-JJ": { post1: iso|null, post2, story } }, custom: [ {id,title,note,type,ref,due,created,doneAt} ] } ---- */
function autoStamp(state, date, slot) {
  var d = state.auto && state.auto[date];
  return d && d[slot] ? d[slot] : null;
}

  var ms = Date.parse(stamp);
  if (isNaN(ms)) { return fallbackDate; }
  return todayKey(ms);

  var s = autoStamp(state, date, slot);
  return s ? stampDay(s, date) : null;
}

  return c.doneAt ? stampDay(c.doneAt, c.due) : null;

function buildToday(state, today) {
  var own = tasksForDate(today, state.swaps);
  var carried = [];
  for (var k = CARRY_DAYS; k >= 1; k--) {
    var d = addDays(today, -k);
    if (d < ANCHOR || d < CARRY_FROM) { continue; }
    tasksForDate(d, state.swaps).forEach(function (t) {
      var dd = doneDayOfAuto(state, t.date, t.slot);
      if (!dd || dd === today) { t.late = dayDiff(t.date, today); carried.push(t); }
    });
  }
  var customs = (state.custom || []).filter(function (c) {
    var dd = doneDayOfCustom(c);
    if (dd) { return dd === today; }
    return c.due <= today;
  }).sort(function (a, b) {
    var da = doneDayOfCustom(a) ? 1 : 0, db = doneDayOfCustom(b) ? 1 : 0;
    if (da !== db) { return da - db; }
    if (a.due !== b.due) { return a.due < b.due ? -1 : 1; }
    return a.created < b.created ? -1 : 1;
  });

  var doneAuto = all.filter(function (t) { return !!autoStamp(state, t.date, t.slot); }).length;
  var doneCustom = customs.filter(function (c) { return !!c.doneAt; }).length;
  var total = all.length + customs.length;

  return (state.custom || []).filter(function (c) { return c.due === date; });
}

  if (date < ANCHOR) { return false; }
  var okAuto = ["post1", "post2", "story"].every(function (s) { return !!autoStamp(state, date, s); });
  if (!okAuto) { return false; }
  return customDueOn(state, date).every(function (c) { return !!c.doneAt; });
}

function computeScore(state, today) {
  var total = 0, todayPts = 0, perfect = 0, d, i;
  var slots = ["post1", "post2", "story"];
  for (d = ANCHOR; d <= today; d = addDays(d, 1)) {
    for (i = 0; i < slots.length; i++) {
      var dd = doneDayOfAuto(state, d, slots[i]);
      if (dd) { total += PTS_AUTO; if (dd === today) { todayPts += PTS_AUTO; } }
    }
    if (isPerfectDay(state, d)) { perfect++; total += PTS_BONUS; if (d === today) { todayPts += PTS_BONUS; } }
  }
  (state.custom || []).forEach(function (c) {
    var cd = doneDayOfCustom(c);
    if (cd) { total += PTS_CUSTOM; if (cd === today) { todayPts += PTS_CUSTOM; } }
  });
  var streak = 0, cursor = isPerfectDay(state, today) ? today : addDays(today, -1);
  while (cursor >= ANCHOR && isPerfectDay(state, cursor)) { streak++; cursor = addDays(cursor, -1); }
  var week = [];
  for (i = 6; i >= 0; i--) {
    var wd = addDays(today, -i);
    if (wd < ANCHOR) { week.push({ date: wd, total: 0, done: 0, pct: 0 }); continue; }
    var cs = customDueOn(state, wd);
    var t = 3 + cs.length;
    var n = slots.filter(function (s) { return !!autoStamp(state, wd, s); }).length + cs.filter(function (c) { return !!c.doneAt; }).length;
    week.push({ date: wd, total: t, done: n, pct: Math.round(100 * n / t) });

  /* Côté Timothée : les demandes de remplacement, avec de quoi répondre ou les passer à Claude. */
  function swapRequests() {
    var out = [], d, i, from = addDays(S.today, -10), to = addDays(S.today, 2), sw;

    if (!keep) { $("gate-pin").value = ""; }
    try { $("gate-pin").focus(); } catch (e) { /* ignoré */ }
  }
  function hideGate() { $("gate").hidden = true; document.body.className = ""; }

  function tryPin(pin, fromSaved) {
    $("gate-go").disabled = true;
    return gasCall(pin, "login").then(function (r) {
      if (r && r.role) {
        savePin(pin);
        hideGate();
        S.admin = r.role === "admin";
        applyAdminVisibility();
        if (S.store && S.store.stop) { S.store.stop(); }
        S.store = makeGasStore(pin, onData, onErr, function (why) {
          S.ready = false; S.confirmed = false; forgetPin(); renderSync();
          showGate(why === "locked" ? "Trop d'essais. Réessaie dans 10 minutes." : "Le code a changé. Entre le nouveau code.");
        });
        S.store.start();
        if (pushCfg()) { pushSync(pin); renderPush(); }
        setTimeout(function () { if (!S.confirmed) { S.slow = true; renderSync(); } }, 10000);
      } else if (r && r.error === "locked") {
        showGate("Trop d'essais. Réessaie dans 10 minutes.");
      } else {
        if (fromSaved) { forgetPin(); }
        showGate(fromSaved ? "Entre ton code." : "Code incorrect.");
      }
    }, function () {
      showGate("Connexion impossible. Vérifie ta connexion et réessaie.", true);
    });
  }
  function startGas() {
    S.mode = "cloud";
    renderSync();
    $("gate-form").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var pin = $("gate-pin").value.replace(/\s+/g, "");
      if (!pin) { $("gate-msg").textContent = "Entre ton code."; return; }
      tryPin(pin, false);
    });
    var saved = readPin();
    if (saved) { document.body.className = "gated"; tryPin(saved, true); } else { showGate(""); }
  }

  function boot() {
    $("f-due").value = S.today;
    $("req-form").addEventListener("submit", onSubmit);
    $("f-cancel").addEventListener("click", resetForm);
    TABS.forEach(function (t) { $("tab-" + t).addEventListener("click", function () { showTab(t, false); }); });
    window.addEventListener("hashchange", function () { var h = ""; try { h = window.location.hash.replace("#", ""); } catch (e) { /* ignoré */ } if (h) { showTab(h, true); } });
    document.addEventListener("visibilitychange", tick);
    setInterval(tick, 60000);
    S.admin = false;
    applyAdminVisibility();
    buildNoteCard();
    renderTodayFoot();
    renderAll();

    if (hasGas()) { startGas(); return; }
    if (!window.claude || typeof window.claude.use !== "function") { startLocal(); return; }
    var decided = false;
    var guard = setTimeout(function () { if (!decided) { decided = true; startLocal(); } }, 12000);
    Promise.all([safeUse("db"), safeUse("user")]).then(function (r) {
      if (decided) { return; }
      decided = true; clearTimeout(guard);
      if (!r[0]) { startLocal(); } else { startCloud(r[0], r[1]); }
    });
  }

  function tick() {
    var k = todayKey(), pc = $("pclock");
    if (pc) { pc.textContent = parisClock(); }
    if (k !== S.today) {
      S.today = k;
      if (!S.editId) { $("f-due").value = k; }
      renderAll();
    }
  }

  boot();
})();

</script>
